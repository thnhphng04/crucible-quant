name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        # The gpu group brings numba: the kernel engine's CPU build runs its parity tests here,
        # and its CUDA build runs under the simulator below — CI has no device (ADR-0038).
        run: uv sync --locked --group gpu

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Layer contracts
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest -m "not docker and not network and not slow"

      - name: CUDA kernels under the simulator
        # A separate run: the switch must be set before numba is imported.
        run: uv run pytest -m cudasim
        env:
          NUMBA_ENABLE_CUDASIM: "1"

      - name: Docs mirror (EN = VI 1:1, no broken links)
        run: uv run python scripts/check_doc_mirror.py

  ui:
    # Typecheck, build and component-test the review front end (ADR-0029). The
    # Playwright smoke run needs a built app plus a Python server, so it stays local.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Component tests
        run: npm test

  sandbox:
    # Builds the sandbox image and proves its isolation with real containers (INV-36).
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Docker tests
        run: uv run pytest -m docker -p no:cacheprovider
